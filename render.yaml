# Render Blueprint: one web service (worker in-process) + managed Postgres + persistent disk for uploads.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: ridgeline-facilities
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    disk:
      name: uploads
      mountPath: /data/uploads
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: ridgeline-db, property: connectionString }
      - key: DATABASE_SSL
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: APP_BASE_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
databases:
  - name: ridgeline-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
